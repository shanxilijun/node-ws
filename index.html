<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人静态页</title>
    <style>
        /* CSS 样式：负责美化 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 2rem;
            width: 100%;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: -30px;
            border-radius: 8px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <header>
        <h1>欢迎来到我的网页</h1>
        <p>这是一个使用 HTML, CSS 和 JS 构建的静态页面</p>
    </header>

    <div class="container">
        <h2>关于这个页面</h2>
        <p>静态网页是指不通过服务器端脚本（如 PHP 或 Python）动态生成的页面。它们加载速度快，安全性高，非常适合个人简历、博客或产品展示。</p>
        
        <hr>

        <h3>实时交互测试</h3>
        <p>点击下方按钮，触发 JavaScript 脚本：</p>
        <button onclick="showMessage()">点我试试</button>
        <p id="message"></p>
    </div>

    <script>
        // JavaScript：负责交互逻辑
        function showMessage() {
            const msgElement = document.getElementById('message');
            msgElement.innerHTML = "你好！这是来自 JavaScript 的问候。当前时间是：" + new Date().toLocaleTimeString();
        }
    </script>

</body>
</html>
